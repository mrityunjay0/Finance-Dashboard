<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Finance Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="center">

<div class="card" style="width: 100%; max-width: 400px;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--text-secondary);">Enter your credentials to access your dashboard</p>
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label style="font-size: 0.875rem; font-weight: 500; color: var(--text-secondary);">Email Address</label>
            <input name="username" type="email" placeholder="name@finance.com" required autofocus>
        </div>
        
        <div>
            <label style="font-size: 0.875rem; font-weight: 500; color: var(--text-secondary);">Password</label>
            <input name="password" type="password" placeholder="••••••••" required>
        </div>

        <div th:if="${param.error}" class="error">
            <svg style="width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null and session.SPRING_SECURITY_LAST_EXCEPTION.class.name == 'org.springframework.security.authentication.DisabledException'}">
                Account is inactive, contact admin
            </span>
            <span th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION != null and session.SPRING_SECURITY_LAST_EXCEPTION.class.name == 'org.springframework.security.authentication.DisabledException'}">
                Invalid email or password
            </span>
        </div>

        <div th:if="${param.logout}" style="color: var(--success); font-size: 0.875rem; margin-bottom: 1rem;">
            Successfully logged out
        </div>

        <button type="submit" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>

    <div style="margin-top: 2rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
        Role-based access demo project
    </div>
</div>

</body>
</html>
