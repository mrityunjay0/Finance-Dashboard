openapi: 3.0.3
info:
  title: Finance Dashboard API
  description: Backend APIs for managing financial records, users, and dashboard analytics.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

tags:
  - name: Dashboard
  - name: Financial Records
  - name: Users

paths:
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get overall financial summary
      description: Retrieves the high-level financial overview for the dashboard, including total aggregated income, total expenses, and the net calculated balance across all recorded data.
      responses:
        '200':
          description: Summary fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'

  /dashboard/category-total:
    get:
      tags: [Dashboard]
      summary: Get category-wise totals
      description: Aggregates all financial records and groups them by category to provide a detailed breakdown of income and expenses per category. Highly useful for generating categorical split charts.
      responses:
        '200':
          description: Category totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

  /dashboard/monthly-trends:
    get:
      tags: [Dashboard]
      summary: Get monthly trends
      description: Computes financial trends over elapsed time, providing a month-by-month breakdown of cash flow (income vs. expense) for the current view. Essential for recognizing tracking patterns.
      responses:
        '200':
          description: Monthly trends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyTrendResponse'

  /dashboard/recent-activity:
    get:
      tags: [Dashboard]
      summary: Get recent financial activity
      description: Fetches a chronologically ordered list of the most recent financial transactions. Typically utilized to populate the recent activity feed on the main dashboard user interface.
      responses:
        '200':
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentActivityResponse'

  /records/create:
    post:
      tags: [Financial Records]
      summary: Create financial record
      description: Records a new financial transaction into the ledger. Requires a valid monetary amount, classification (INCOME/EXPENSE), a functional category, and a valid transaction date timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialRecordRequest'
      responses:
        '201':
          description: Record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecord'

  /records/filter:
    get:
      tags: [Financial Records]
      summary: Filter financial records
      description: Retrieves a tailored dataset of financial records based on optional query parameters. Supports multi-faceted filtering by transaction type, category, and date boundaries for analytical purposes.
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/RecordType'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Filtered records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialRecord'

  /records/all:
    get:
      tags: [Financial Records]
      summary: Get all records
      description: Returns an unfiltered, exhaustive ledger of all financial transactions stored within the active system. Note that this may return a substantially large dataset in extensive setups.
      responses:
        '200':
          description: List of records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialRecord'

  /records/{id}:
    get:
      tags: [Financial Records]
      summary: Get record by ID
      description: Retrieves the complete structural details of a specific financial record by its unique system identifier. Returns a 404 response if the requested record does not exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecord'

  /records/update/{id}:
    put:
      tags: [Financial Records]
      summary: Update record
      description: Modifies an existing financial transaction. All payload fields are strictly required and will completely overwrite the existing data stored against the specified record ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialRecordRequest'
      responses:
        '200':
          description: Updated record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecord'

  /records/delete/{id}:
    delete:
      tags: [Financial Records]
      summary: Delete record
      description: Permanently executes the removal of a financial record from the ledger based on its ID. This action is irreversible and immediately propagates to dashboard analytics calculations.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Record deleted

  /user/create:
    post:
      tags: [Users]
      summary: Create user
      description: Provisions a new secure user identity within the system. Newly created profiles are assigned a default role (VIEWER) and must be supplied with valid credential mappings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /user/all:
    get:
      tags: [Users]
      summary: Get all users
      description: Retrieves a comprehensive directory dictionary of all registered users in the system, including their systemic role and operative status. Primarily intended for administrative auditing layers.
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /user/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Fetches full administrative profile metadata for a specific user identity corresponding to their unique assigned system ID integer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /user/update/{id}:
    put:
      tags: [Users]
      summary: Update user
      description: Modifies the profile or operational status of an active user. Typically engaged by system administrators to toggle account access (ACTIVE/INACTIVE) or alter core identity properties.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /user/delete/{id}:
    delete:
      tags: [Users]
      summary: Delete user
      description: Permanently purges a registered user record from the authentication system tables, synchronously revoking their architectural access privileges to the dashboard API.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted

components:
  schemas:
    SummaryResponse:
      type: object
      properties:
        totalIncome:
          type: number
        totalExpense:
          type: number
        netBalance:
          type: number

    CategoryResponse:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/Category'
        totalIncome:
          type: number
        totalExpense:
          type: number

    MonthlyTrendResponse:
      type: object
      properties:
        month:
          type: integer
        totalIncome:
          type: number
        totalExpense:
          type: number

    RecentActivityResponse:
      type: object
      properties:
        amount:
          type: number
        type:
          $ref: '#/components/schemas/RecordType'
        category:
          $ref: '#/components/schemas/Category'
        date:
          type: string
          format: date
        note:
          type: string

    FinancialRecordRequest:
      type: object
      required: [amount, type, category, date]
      properties:
        amount:
          type: number
        type:
          $ref: '#/components/schemas/RecordType'
        category:
          $ref: '#/components/schemas/Category'
        description:
          type: string
        date:
          type: string
          format: date

    FinancialRecord:
      allOf:
        - $ref: '#/components/schemas/FinancialRecordRequest'
        - type: object
          properties:
            id:
              type: integer

    UserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'

    User:
      allOf:
        - $ref: '#/components/schemas/UserRequest'
        - type: object
          properties:
            id:
              type: integer
            role:
              $ref: '#/components/schemas/UserRole'

    RecordType:
      type: string
      enum: [INCOME, EXPENSE]

    Category:
      type: string
      enum: [SALARY, INVESTMENT, GIFT, FOOD, TRANSPORTATION, ENTERTAINMENT, UTILITIES, HEALTHCARE, EDUCATION, OTHER]

    UserRole:
      type: string
      enum: [VIEWER, ANALYST, ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE]